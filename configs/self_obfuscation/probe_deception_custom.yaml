# Path to an organism checkpoint produced by run_full_pipeline.py / concept_model_train_rated.py
model_name_or_path: "path/to/your/model_checkpoint"

# Probe configurations
probes:
  logistic_baseline:
    type: "logistic"
    learning_rate: 4e-5
    batch_size: 16
    num_epochs: 1
    target_layers: [12]
    pooling_type: "mean"

training_datasets:
  train:
    positive: ["dolus_deceptive_train"]
    negative: ["dolus_benign_train"]

test_datasets:
  test:
    positive: ["dolus_deceptive_test"]
    negative: ["dolus_benign_test"]

wandb_project: "probe-training"
wandb_entity: your-wandb-entity  # Replace with your WandB entity
wandb_name: null
wandb_tags: []
